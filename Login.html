<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alumni Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f4fc;
        }

        header {
            background-color: #5B3CC5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #5B3CC5;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            margin: 4px;
            display: inline-block;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #5B3CC5;
            color: white;
        }

        .login-box {
            width: 400px;
            max-width: 80%;
            margin: 70px auto;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #d7cce3;
        }

        .login-box h2 {
            text-align: center;
            color: #5d467e;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            background-color: #5B3CC5;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5B3CC5;
        }

        .back-home {
            text-align: center;
            margin: 30px;
        }

        .back-home a {
            background-color: #5B3CC5;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 7px;
        }

        footer {
            background-color: #5B3CC5;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>

<header>

    <h1>ARUNACHALA ALUMNI PORTAL</h1>

    <p>Alumni Login</p>

</header>


<nav>

    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Registration</a>
    <a href="alumni achievements.html">Achievements</a>
    <a href="alumni events.html">Events</a>
    <a href="contact.html">Contact</a>

</nav>


<div class="login-box">

    <h2>🔐 Alumni Login</h2>

    <form onsubmit="loginUser(event)">

        <label>Email</label>

        <input type="email"
               id="email"
               placeholder="Enter your email"
               required>


        <label>Password</label>

        <input type="password"
               id="password"
               placeholder="Enter your password"
               required>


        <button type="submit">
            Login
        </button>

    </form>

</div>


<div class="back-home">

    <a href="index.html">← Back to Home</a>

</div>


<footer>

    <p>© 2026 Arunachala College of Engineering for Women</p>

</footer>


<script>

    function loginUser(event) {

        event.preventDefault();

        alert("Login Successfully!");

    }

</script>

</body>
</html>
